[project]
name = "linear-attention-code"
version = "0.1.0"
description = "Scratchpad implementations of sub-quadratic sequence models"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.9,<0.10",
    "jaxlib>=0.9,<0.10",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=1.26",
    "matplotlib>=3.8"
]

[dependency-groups]
# W&B sweep/runtime tooling. Kept out of core dependencies so the small local
# experiments stay lightweight.
experiment = [
    "wandb>=0.17",
]

# NVIDIA GPU acceleration (Linux x86_64). Opt in on GPU VMs with
# `uv sync --group cuda --group experiment`. The launch script sets
# JAX_PLATFORMS=cuda,cpu and REQUIRE_JAX_GPU=1 so CUDA runs fail fast if JAX
# falls back to CPU.
cuda = [
    "jax[cuda12]>=0.9,<0.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

program: experiments.sweep_titans_toy
project: linear-attention
name: titans-easy
method: bayes
metric:
  name: objective/score
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
command:
  - uv
  - run
  - --no-sync
  - python
  - -m
  - ${program}
parameters:
  config_name:
    value: easy
  max_inner_lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.03
  learning_rate:
    distribution: log_uniform_values
    min: 0.001
    max: 0.01
  memory_mult:
    values: [1, 2, 4]
  seed:
    values: [1, 2, 3]
  dim:
    values: [32, 48, 64]
  n_heads:
    values: [1, 2, 4]
  n_layers:
    values: [1, 2, 3]
  mlp_mult:
    values: [2, 4]
  n_train:
    value: 20000
  n_test:
    value: 512
  batch_size:
    value: 64
  eval_batch_size:
    value: 64
  max_epochs:
    value: 20
  patience_epochs:
    value: 6
